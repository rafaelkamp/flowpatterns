server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: flowpatterns
  datasource:
    url: jdbc:h2:mem:flowpatterns;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

flowpatterns:
  seed:
    enabled: true
  alcadas:
    despesa-limite-diretor: 5000.00
    compra-limite-diretor: 20000.00
    ferias-dias-limite-diretor: 20

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.rafaelkamp.flowpatterns: INFO
