spring:
  datasource:
    url: jdbc:h2:mem:flowpatterns-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

flowpatterns:
  seed:
    enabled: false

logging:
  level:
    com.rafaelkamp.flowpatterns: WARN
    org.springframework.test: WARN
